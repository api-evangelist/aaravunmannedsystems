note: >-
  NOBODY SHIPS AN MCP SERVER FOR THIS PROVIDER. Searches of aereo.io, resources.aereo.io, the npm
  registry and PyPI found no hosted or local Aereo MCP server, and no MCP endpoint is referenced in
  the Aereo Cloud client bundle. The tools below are a CANDIDATE surface derived mechanically from
  the twelve operations in the published Tile Server OpenAPI — they are what an MCP server WOULD
  expose, not something an agent can call today. For this reason NO `type: MCPServer` pointer is
  wired into apis.yml: the pointer asserts the provider serves an agent surface, and this one does
  not exist.
