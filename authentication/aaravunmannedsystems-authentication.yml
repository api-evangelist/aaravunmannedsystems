note: >-
  THE SPEC UNDER-DECLARES ITS OWN AUTH. openapi/aaravunmannedsystems-tile-server-openapi-original.json
  declares NO components.securitySchemes and no security[] on any operation, yet every operation except
  GET /ping returns HTTP 401 unauthenticated. The auth model below was established by probing, not by
  reading the contract — an agent working from the published spec alone would believe the API is open.
  This is a contract-quality gap worth reporting to the provider.
