gaps:
- No securitySchemes in the published OpenAPI despite enforced bearer auth.
- No documented token issuance endpoint, token lifetime, or scope model for API clients.
- No /.well-known/openid-configuration or /.well-known/oauth-authorization-server on any aereo.io host.
