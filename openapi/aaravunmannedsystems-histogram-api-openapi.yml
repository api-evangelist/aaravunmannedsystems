openapi: 3.2.0
info:
  title: Tile Server Histogram API
  description: A microservice for serving the map tiles
  version: 0.1.0
tags:
- name: Histogram
paths:
  /histogram/{z}/{x}/{y}.png:
    get:
      summary: Cog Histogram Tile View
      operationId: cog_histogram_tile_view_histogram__z___x___y__png_get
      parameters:
      - name: z
        in: path
        required: true
        schema:
          type: integer
          title: Z
      - name: x
        in: path
        required: true
        schema:
          type: integer
          title: X
      - name: y
        in: path
        required: true
        schema:
          type: integer
          title: Y
      - name: rescale
        in: query
        required: true
        schema:
          type: string
          title: Rescale
      - name: key
        in: query
        required: true
        schema:
          type: string
          title: Key
      - name: tile_size
        in: query
        required: false
        schema:
          type: integer
          default: 256
          title: Tile Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Histogram
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
