openapi: 3.2.0
info:
  title: Tile Server Terrain API
  description: A microservice for serving the map tiles
  version: 0.1.0
tags:
- name: Terrain
paths:
  /terrain/layer.json:
    get:
      summary: Terrain Metadata View
      operationId: terrain_metadata_view_terrain_layer_json_get
      parameters:
      - name: key
        in: query
        required: true
        schema:
          type: string
          title: Key
      - name: iteration_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Iteration Id
      - name: with_master_server
        in: query
        required: false
        schema:
          default: false
          title: With Master Server
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Terrain
  /terrain/{z}/{x}/{y}.terrain:
    get:
      summary: Terrain Tile View
      operationId: terrain_tile_view_terrain__z___x___y__terrain_get
      parameters:
      - name: z
        in: path
        required: true
        schema:
          type: integer
          title: Z
      - name: x
        in: path
        required: true
        schema:
          type: integer
          title: X
      - name: y
        in: path
        required: true
        schema:
          type: integer
          title: Y
      - name: key
        in: query
        required: true
        schema:
          type: string
          title: Key
      - name: with_master_server
        in: query
        required: false
        schema:
          default: false
          title: With Master Server
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Terrain
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
