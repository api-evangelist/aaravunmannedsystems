aid: aaravunmannedsystems
name: Aarav Unmanned Systems (Aereo)
description: 'Aarav Unmanned Systems (AUS), which rebranded as Aereo in 2023, is an Indian end-to-end
  enterprise drone company founded in 2013 out of the research labs of IIT Kanpur and headquartered in
  Bengaluru. It designs and manufactures survey-grade UAVs and operates Aereo Cloud, a geospatial data
  platform that turns drone-captured imagery into orthomosaics, digital terrain models, 3D tilesets and
  AI-driven analytics for mining volumetrics, infrastructure and construction monitoring, urban and rural
  land records, agriculture and forest conservation. The company reports mapping over 45,000 villages
  and surveying more than 15 million acres. Its public machine-readable API surface is narrow: the Aereo
  Cloud web application is authenticated and JS-rendered, but its Tile Server microservice publishes a
  real OpenAPI 3.1.0 description at https://tiles.aereo.io/openapi.json covering vector, raster, Cesium
  terrain and 3D Tiles delivery.'
