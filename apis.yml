- aid: aaravunmannedsystems:aereo7a4d-real-time-inference-server
  name: Aereo Cloud Real-Time Inference Server
  description: WebSocket-based real-time SAM2 (Segment Anything 2) inference service used by Aereo Cloud
    for interactive segmentation of drone imagery. Its HTTP contract exposes only a liveness probe; the
    inference surface itself is a WebSocket channel that the published contract does not describe and
    for which no AsyncAPI is published.
  humanURL: https://cloud.aereo.io/
  baseURL: https://ac-rti-server-prod.aereo.io
