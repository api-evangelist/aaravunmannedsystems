apis:
- aid: aaravunmannedsystems:aaravunmannedsystems-tile-server
  name: Aereo Cloud Tile Server
  description: A microservice for serving the map tiles behind Aereo Cloud. Publishes a FastAPI-generated
    OpenAPI 3.1.0 description with twelve read operations delivering Mapbox vector tiles (.pbf), Cloud
    Optimized GeoTIFF orthomosaic and histogram raster tiles (.png), MBTiles rasters, quantized-mesh terrain
    tiles and their layer.json metadata, Cesium 3D Tiles and computer-vision tilesets, plus a point-altitude
    lookup and a health check. Discovered at the API host root; the spec declares no servers[] block and
    no securitySchemes.
  humanURL: https://cloud.aereo.io/
  baseURL: https://tiles.aereo.io
  image: https://aereo.io/wp-content/uploads/2023/06/logo.svg
